# Atualiza a cópia rápida do painel a partir da planilha do Dropbox e publica o site.
#
# Como funciona (sem ninguém precisar rodar nada):
# - A cada 10 minutos, a etapa "conferir" baixa SÓ os últimos 64 KB da planilha
#   (o índice do arquivo .xlsm, que muda sempre que a planilha é salva) e compara
#   com a impressão digital da última publicação. Leva segundos.
# - Só se a planilha mudou, a etapa "publicar" baixa a planilha inteira, monta a
#   cópia rápida e publica o site. Na prática: uma montagem por atualização.
# - Também publica quando o código do painel muda (push) ou quando rodada à mão.
# - Requer: Settings → Pages → Source = "GitHub Actions".
# - Proteção: a cada execução agendada, a rotina reativa a si mesma pela API do GitHub,
#   o que zera o contador de 60 dias sem atividade.

name: Atualizar dados do painel

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"   # confere a cada 10 minutos
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

env:
  PLANILHA_URL: "https://dl.dropboxusercontent.com/scl/fi/xv93qy8t293au22unojov/Por-venda_2026.xlsm?rlkey=gtyk5at1kta87k5rlioktgwxb&dl=1"
  SITE_URL: "https://nevespng68.github.io/janela-bar-dashboard"

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publicar: ${{ steps.mudou.outputs.publicar }}
      indice: ${{ steps.mudou.outputs.indice }}
    steps:
      - name: Manter rotina ativa (evita desligamento após 60 dias)
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/atualizar-dados.yml/enable"

      - name: Conferir se a planilha mudou (só os últimos 64 KB)
        id: mudou
        run: |
          INDICE=""
          for i in 1 2 3; do
            CODIGO=$(curl -sSL -r -65536 -o fim.bin -w "%{http_code}" "$PLANILHA_URL" || echo "000")
            if [ "$CODIGO" = "206" ]; then INDICE=$(sha256sum fim.bin | cut -d' ' -f1); break; fi
            echo "Tentativa $i: Dropbox respondeu $CODIGO"; sleep 10
          done
          PUBLICADO=$(curl -fsSL "$SITE_URL/dados/indice.txt?t=$(date +%s)" 2>/dev/null | tr -d '[:space:]' || true)
          echo "Planilha: ${INDICE:-desconhecido} | Publicado: ${PUBLICADO:-nenhum}"
          echo "indice=$INDICE" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "publicar=sim" >> "$GITHUB_OUTPUT"
          elif [ -z "$INDICE" ]; then
            echo "Não foi possível conferir agora; tenta de novo em 10 minutos."
            echo "publicar=nao" >> "$GITHUB_OUTPUT"
          elif [ "$INDICE" = "$PUBLICADO" ]; then
            echo "Planilha sem alterações; nada a fazer."
            echo "publicar=nao" >> "$GITHUB_OUTPUT"
          else
            echo "Planilha mudou; montando a cópia rápida."
            echo "publicar=sim" >> "$GITHUB_OUTPUT"
          fi

  publicar:
    needs: conferir
    if: needs.conferir.outputs.publicar == 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Baixar planilha do Dropbox
        run: |
          curl -fsSL --retry 3 --retry-delay 10 -o planilha.xlsm "$PLANILHA_URL"
          TAM=$(stat -c %s planilha.xlsm)
          echo "Tamanho: $TAM bytes"
          # Confere se veio mesmo uma planilha (arquivo zip) e não uma página de erro.
          head -c 2 planilha.xlsm | grep -q "PK" || { echo "Download não é uma planilha."; exit 1; }
          [ "$TAM" -gt 1000000 ] || { echo "Planilha pequena demais, abortando."; exit 1; }
          sha256sum planilha.xlsm | cut -d' ' -f1 > origem.sha256
          # Impressão digital dos últimos 64 KB do arquivo baixado (mesma conta que o painel faz).
          tail -c 65536 planilha.xlsm | sha256sum | cut -d' ' -f1 > indice.txt
          echo "Índice: $(cat indice.txt)"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar arquivo leve
        run: |
          npm install --no-save --no-package-lock xlsx@0.18.5
          mkdir -p _site/dados
          node --max-old-space-size=6144 scripts/converter-planilha.js planilha.xlsm _site/dados/painel.json.gz
          cp origem.sha256 indice.txt _site/dados/
          cp index.html _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
